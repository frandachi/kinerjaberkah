# NGINX — replace kpiberkah dengan kinerjaberkah di 192.168.3.13
# Pasang: /etc/nginx/conf.d/kinerjaberkah.conf
# JANGAN sisakan file .backup / .disabled di conf.d atau sites-enabled
# (nginx include * tetap memuatnya → conflicting server_name).
#
# URL baru (kanonik):  https://192.168.3.13/kinerjaberkah/
# URL lama:            https://192.168.3.13/kpiberkah/  → 301 ke /kinerjaberkah/
#
# Sertifikat (jika belum ada):
# sudo mkdir -p /etc/nginx/ssl
# sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout /etc/nginx/ssl/kpi.key -out /etc/nginx/ssl/kpi.crt \
#   -subj "/CN=192.168.3.13"

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.3.13 kpi.banksumut.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 192.168.3.13 kpi.banksumut.local;

    ssl_certificate     /etc/nginx/ssl/kpi.crt;
    ssl_certificate_key /etc/nginx/ssl/kpi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # root = /home/services supaya /kinerjaberkah/file → /home/services/kinerjaberkah/file
    root /home/services;
    index index.html;

    # --- App baru ---
    location /kinerjaberkah/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Aset statis: jangan fallback ke index.html (itu penyebab Content-Type: text/html)
    location ~* ^/kinerjaberkah/.+\.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location /kinerjaberkah/ {
        try_files $uri $uri/ /kinerjaberkah/index.html;
    }

    # --- App lama: API tetap di-proxy (bookmark/cache), UI di-redirect ---
    location /kpiberkah/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /kpiberkah {
        return 301 /kinerjaberkah/;
    }

    location /kpiberkah/ {
        rewrite ^/kpiberkah/(.*)$ /kinerjaberkah/$1 permanent;
    }

    location = / {
        return 301 /kinerjaberkah/;
    }

    location / {
        return 301 /kinerjaberkah/;
    }

    location ~ /\. {
        deny all;
    }
}
