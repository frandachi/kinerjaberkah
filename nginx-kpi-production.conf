# NGINX PRODUCTION CONFIGURATION FOR KPI CORPORATE
# File location on server usually: /etc/nginx/sites-available/kinerjaberkah
# Make sure to generate SSL certificates first:
# sudo mkdir -p /etc/nginx/ssl
# sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/kpi.key -out /etc/nginx/ssl/kpi.crt -subj "/CN=192.168.3.13"

# 1. Force HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.3.13 kpi.banksumut.local; # Change domain if applicable

    # Redirect all traffic to HTTPS
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 192.168.3.13 kpi.banksumut.local;

    # SSL Certificates
    ssl_certificate     /etc/nginx/ssl/kpi.crt;
    ssl_certificate_key /etc/nginx/ssl/kpi.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Path to Vite dist folder (Adjust based on your actual path)
    root /var/www/html/kinerjaberkah;
    index index.html;

    # Frontend React/Vite routing
    location /kinerjaberkah/ {
        alias /var/www/html/kinerjaberkah/;
        try_files $uri $uri/ /kinerjaberkah/index.html;
    }

    # Root fallback to app subfolder
    location / {
        return 301 /kinerjaberkah/;
    }

    # Backend Node.js API Proxy
    location /kinerjaberkah/api/ {
        proxy_pass http://127.0.0.1:5555/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Pass real client IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Deny access to hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }
}
